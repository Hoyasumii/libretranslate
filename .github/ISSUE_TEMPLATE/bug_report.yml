name: Bug report
description: Something in the SDK, the MCP server or the CLI does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not go here: report them privately, as [SECURITY.md](https://github.com/Hoyasumii/libretranslate/blob/main/SECURITY.md) describes.
        Never paste an API key, and check that logs and responses carry none.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SDK (createLibreTranslateClient and the orval-generated functions)
        - SDK — the OpenAPI spec (a field or an answer that does not match an instance)
        - MCP server — curated tools (translate, translate_file, detect, languages, status, suggest)
        - MCP server — generic tools (libretranslate_resources, libretranslate_describe, libretranslate_call)
        - CLI (libretranslate, libretranslate mcp …)
        - Docs site
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Include the full error.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest code, command or tool call that shows it.
      render: typescript
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: "@hoyasumii/libretranslate version"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: libretranslate-version
    attributes:
      label: LibreTranslate instance
      description: libretranslate.com, or the self-hosted version (the `libretranslate/libretranslate` image tag).
      placeholder: "libretranslate.com / self-hosted v1.9.6"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and OS
      description: For the MCP server or the CLI, say also which client runs it (Claude Code, Codex, OpenCode) and whether through WSL.
      placeholder: "Node 22.11, Ubuntu 24.04 on WSL2"
